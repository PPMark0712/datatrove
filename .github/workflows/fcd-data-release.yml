name: Attach FCD data to Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag (creates a Release if missing)
        required: true
        type: string
      source_tag:
        description: Release containing the original fcd_data.zip
        required: true
        default: fcd-data
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_tag:
        default: fcd-data
        type: string

permissions:
  contents: write

concurrency:
  group: fcd-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  attach-data:
    if: github.event_name != 'release' || github.event.release.tag_name != (vars.FCD_DATA_SOURCE_TAG || 'fcd-data')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      SOURCE_TAG: ${{ inputs.source_tag || vars.FCD_DATA_SOURCE_TAG || 'fcd-data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the existing resource asset
        shell: bash
        run: |
          set -euo pipefail
          export RESOURCE_PATH="$RUNNER_TEMP/fcd-data/fcd_data.zip"
          printf 'RESOURCE_PATH=%s\n' "$RESOURCE_PATH" >> "$GITHUB_ENV"
          if [[ "$TARGET_TAG" == "$SOURCE_TAG" ]]; then
            echo "Source and target must be different Releases."
            exit 1
          fi
          mkdir -p "$(dirname "$RESOURCE_PATH")"
          gh release download "$SOURCE_TAG" --repo "$GH_REPO" --pattern fcd_data.zip --dir "$(dirname "$RESOURCE_PATH")"
      - name: Validate the resource archive
        run: python src/datatrove/pipeline/fcd/build_dict/package_data.py --validate "$RESOURCE_PATH"
      - name: Attach to the target Release
        shell: bash
        run: |
          set -euo pipefail
          # Validate/download before creating a draft, so a missing source asset
          # cannot leave an empty new Release behind.
          if ! gh release view "$TARGET_TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$TARGET_TAG" --repo "$GH_REPO" --verify-tag --draft --generate-notes
            echo 'CREATED_RELEASE=true' >> "$GITHUB_ENV"
          fi
          # Keep published resources unchanged on a rerun.
          gh release view "$TARGET_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/asset-names.txt"
          if grep -Fxq fcd_data.zip "$RUNNER_TEMP/asset-names.txt"; then
            echo "Target already contains fcd_data.zip; leaving it unchanged."
          else
            gh release upload "$TARGET_TAG" "$RESOURCE_PATH" --repo "$GH_REPO"
          fi
      - name: Publish the new Release after attaching data
        if: env.CREATED_RELEASE == 'true'
        run: gh release edit "$TARGET_TAG" --repo "$GH_REPO" --draft=false
